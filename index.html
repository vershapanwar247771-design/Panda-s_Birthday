<!DOCTYPE <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Pretty Panda!</title>
    <!-- Google Fonts for festive typography -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff6b81;
            --secondary: #ffafbd;
            --background: #f7f9fc;
            --text: #2f3542;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--secondary), #ffc3a0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Mobile-first card container */
        .card-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        /* Decorative floating balloons */
        .balloon-icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .sub-text {
            color: #747d8c;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        /* Hidden section for the surprise wish */
        .wish-content {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.6s ease, opacity 0.6s ease;
        }

        .wish-content.reveal {
            max-height: 500px;
            opacity: 1;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #ffeaa7;
        }

        .personal-message {
            color: var(--text);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .signature {
            font-weight: 600;
            color: var(--primary);
        }

        /* Interactive pulse button */
        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 129, 0.4);
            outline: none;
            transition: background 0.2s, transform 0.1s;
            animation: pulse 2s infinite;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 129, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 107, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 129, 0); }
        }

        /* Responsive scaling for smaller screen sizes */
        @media (max-width: 360px) {
            h1 { font-size: 1.8rem; }
            .personal-message { font-size: 1rem; }
            .action-btn { padding: 12px 28px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="panda-icon">🐼</div>
        <h1>Happy Birthday, Pretty Panda!</h1>
        <p class="sub-text">Today is all about celebrating you.</p>
        
        <!-- Interactive Trigger Button -->
        <button class="action-btn" id="surpriseBtn" onclick="revealSurprise()">Tap for a Surprise</button>

        <!-- Hidden Message Container -->
        <div class="wish-content" id="wishMessage">
            <p class="personal-message">
                Wishing you a year filled with endless laughter, incredible adventures, and all the success you deserve. Thank you for being a caring and loving friend! 🎂✨
            </p>
            <p class="signature">Best Wishes, [Muku🍓]</p>
            
              <video controls="" width="250" height="250" <source src="html.mp4" type="video/mp4" >
        </div>
    </div>

    <!-- Canvas Confetti Library Integration -->
    <script src="https://jsdelivr.net"></script>
    
    <script>
        function revealSurprise() {
            const btn = document.getElementById('surpriseBtn');
            const wish = document.getElementById('wishMessage');
            
            // Turn off pulsing animation and hide button smoothly
            btn.style.animation = 'none';
            btn.style.display = 'none';
            
            // Disolve overlay and reveal message
            wish.classList.add('reveal');
            
            // Fire confetti animation bursts
            fireConfetti();
        }

        function fireConfetti() {
            // Left side burst
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { x: 0.2, y: 0.6 }
            });
            
            // Right side burst
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { x: 0.8, y: 0.6 }
            });

            // Continuous secondary shower for effect
            setTimeout(() => {
                confetti({
                    particleCount: 50,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
            }, 250);

            setTimeout(() => {
                confetti({
                    particleCount: 50,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });
            }, 250);
        }
    </script>
</body>
</html>
